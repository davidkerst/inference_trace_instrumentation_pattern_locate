[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "davidkerst-inference_trace_instrumentation_pattern_locate"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告模型微调平台工程师·推理链路的追踪埋点相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "davidkerst" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://davidkerst.github.io"
Repository = "https://github.com/davidkerst/inference_trace_instrumentation_pattern_locate"
Issues = "https://github.com/davidkerst/inference_trace_instrumentation_pattern_locate/issues"

[project.scripts]
inference_trace_instrumentation_pattern_locate = "inference_trace_instrumentation_pattern_locate:main"

[tool.setuptools]
py-modules = ["inference_trace_instrumentation_pattern_locate"]
